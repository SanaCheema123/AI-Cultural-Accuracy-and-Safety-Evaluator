services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: culturalguard
      POSTGRES_USER: culturalguard
      POSTGRES_PASSWORD: culturalguard
    ports:
      - "5432:5432"
    volumes:
      - cg_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culturalguard -d culturalguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://culturalguard:culturalguard@postgres:5432/culturalguard
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - cg_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 4s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cg_postgres:
  cg_uploads:
